name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate private Go dependencies
        env:
          YUELI_CI_READ_TOKEN: ${{ secrets.YUELI_CI_READ_TOKEN }}
        run: |
          if [ -z "$YUELI_CI_READ_TOKEN" ]; then
            echo '::error::YUELI_CI_READ_TOKEN must have read access to the private dependency repositories.'
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$YUELI_CI_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          {
            echo 'GOPRIVATE=github.com/yueli-official/*'
            echo 'GIT_CONFIG_COUNT=1'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/yueli-official/.extraheader'
            printf 'GIT_CONFIG_VALUE_0=AUTHORIZATION: basic %s\n' "$auth"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
      - run: go test ./...
        env:
          GOWORK: off
      - run: go vet ./...
      - name: OpenAPI freshness
        run: |
          go run ./cmd/paste
          diff -u contracts/openapi/paste.json "$PASTE_OPENAPI_OUTPUT"
        env:
          PASTE_OPENAPI_OUTPUT: ${{ runner.temp }}/paste-openapi.json
      - name: Generated catalog freshness
        run: >-
          go run github.com/yueli-official/foundation/go/httpcontract/cmd/httpcontract@v0.4.1
          -errors contracts/http-result/error-catalog.json -operations contracts/http-result/operations.json
          -generate-go internal/pasteerr/catalog_gen.go -package pasteerr
          -generate-ts web/app/generated/pasteFailure.ts -ts-type PasteFailure
          -generate-i18n web/app/generated/error-i18n-inventory.json -check
      - name: HTTP Result compatibility
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_ref="${PR_BASE_SHA:-HEAD^}"
          if git cat-file -e "${base_ref}:contracts/http-result/error-catalog.json"; then
            temp_dir="$(mktemp -d)"
            git show "${base_ref}:contracts/http-result/error-catalog.json" > "${temp_dir}/errors.json"
            git show "${base_ref}:contracts/http-result/operations.json" > "${temp_dir}/operations.json"
            go run github.com/yueli-official/foundation/go/httpcontract/cmd/httpcontract@v0.4.1 \
              -errors contracts/http-result/error-catalog.json -operations contracts/http-result/operations.json \
              -base-errors "${temp_dir}/errors.json" -base-operations "${temp_dir}/operations.json"
          fi
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
